services:
  - type: web
    name: unsolved-case-files-backend
    runtime: docker
    dockerfilePath: ./detective-backend/Dockerfile
    dockerContext: ./detective-backend
    plan: free
    region: singapore
    autoDeploy: true
    envVars:
      - key: LLM_API_BASE
        value: https://openrouter.ai/api/v1
      - key: LLM_API_KEY
        sync: false # Set your OpenRouter API Key in Render Dashboard (Environment tab)
      - key: LLM_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: REQUIRE_CLIENT_SIGNATURE
        value: "true"
      - key: GAME_CLIENT_SECRET
        value: Phenikaa_UCF_AI_SecretKey_2026_SecureHmacKey_x9!
      - key: PORT
        value: 10000
